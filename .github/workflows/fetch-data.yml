name: Daily Market Data Fetch

on:
  schedule:
    # Runs daily at 7:30 AM EDT (11:30 AM UTC)
    - cron: '30 11 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Check if automation is enabled via ENABLE_AUTO_FETCH secret
    # To disable: set ENABLE_AUTO_FETCH to 'false' in repository secrets
    # To enable: set ENABLE_AUTO_FETCH to 'true' (or delete the secret to default to true)
    if: |
      github.event_name == 'workflow_dispatch' ||
      secrets.ENABLE_AUTO_FETCH != 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Run fetch script
        run: node fetch.js

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add live-data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update market data" && git push)

      - name: Build and publish to GitHub Pages
        run: |
          mkdir -p docs
          cp index.html docs/
          cp styles.css docs/
          cp app.js docs/
          cp live-data.js docs/
          git add docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: publish feed to GitHub Pages" && git push)
